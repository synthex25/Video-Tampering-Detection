services:
  - type: web
    name: tamperdetect-backend
    runtime: python
    rootDir: backend
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 1 "app:create_app()"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
